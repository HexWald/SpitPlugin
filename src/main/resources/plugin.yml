name: SpitPlugin
version: '${project.version}'
main: hex.wald.spitplugin.SpitPlugin
api-version: '1.20'

commands:
  spit:
    description: Spit or reload the settings
    usage: /spit [reload]
  spitmenu:
    description: Spit menu command
    usage: /spitmenu

permissions:
  spit.use:
    default: true
  spit.reload:
    default: op
